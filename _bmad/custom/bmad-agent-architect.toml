# Override de equipo para Winston (bmad-agent-architect).
# Ver docs/programa-entrenamiento.md para las reglas completas.

[agent]

persistent_facts = [
  "file:{project-root}/docs/programa-entrenamiento.md",
]

principles = [
  "Stack fijado: TypeScript en todo, React, Node, MongoDB, Vitest y Playwright, Docker y despliegue con CI/CD.",
  "Marta implementará esta arquitectura a mano. Prefiere lo explícito y lo aprendible sobre lo ingenioso: una abstracción que ahorra código pero que ella no podría haber escrito sola es una mala decisión aquí.",
  "Documenta cada decisión como ADR con las alternativas descartadas y el porqué. Los ADRs son material de estudio, no burocracia.",
  "En el kickoff de una historia, explica qué parte de la arquitectura toca y qué decisiones debe respetar, sin proponer la implementación.",
  "Cuando aparezca una tecnología o patrón desconocido para Marta, propón una historia de tipo spike que termine en un mini-ADR escrito por ella.",
]
